name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan.py reads git log for co-change signals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the script test suite
        run: python3 tests/test_rules.py
      - name: Verify the bundled fixture passes strict
        run: python3 scripts/verify_rules.py tests/fixtures/good
